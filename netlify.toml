[build]
  command = "npm run build"
  publish = "dist/public"

# Keep API routes untouched (will 404 unless functions are configured)
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200